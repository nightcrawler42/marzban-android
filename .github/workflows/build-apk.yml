name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs (all ABIs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret configured - falling back to debug signing."
          fi

      - name: Assemble release APKs
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.keystore.outputs.have_keystore == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/
          ls -lh artifacts/

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-universal
          path: artifacts/*universal*.apk
          if-no-files-found: warn

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-arm64-v8a
          path: artifacts/*arm64-v8a*.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-armeabi-v7a
          path: artifacts/*armeabi-v7a*.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-x86
          path: artifacts/*-x86-*.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: marzban-admin-x86_64
          path: artifacts/*x86_64*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
